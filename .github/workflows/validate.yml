# .github/workflows/validate.yml
name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill packages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'jsonschema>=4.0'

      - name: Verify scripts compile
        run: |
          python -m py_compile scripts/validate_skill.py
          python -m py_compile scripts/build_zip.py
          python -m py_compile scripts/update_catalog.py
          echo "All Python scripts compile."

      - name: Verify manifest.schema.json exists and is valid JSON
        run: |
          if [ ! -f manifest.schema.json ]; then
            echo "::error::manifest.schema.json is missing at the repository root"
            exit 1
          fi
          python -c "import json; json.load(open('manifest.schema.json', encoding='utf-8'))"
          echo "manifest.schema.json is valid JSON."

      - name: Validate every skill package
        run: |
          set -euo pipefail
          failed=0
          checked=0
          skipped=0

          shopt -s nullglob
          for dir in skills/*/; do
            [ -d "$dir" ] || continue

            skill=$(basename "$dir")
            manifest="${dir}manifest.json"

            if [ ! -f "$manifest" ]; then
              echo "::error file=${manifest}::${skill} — manifest.json is missing"
              failed=1
              continue
            fi

            if [ ! -s "$manifest" ]; then
              echo "::warning file=${manifest}::${skill} — manifest.json is empty (placeholder); skipping"
              skipped=$((skipped + 1))
              continue
            fi

            checked=$((checked + 1))
            echo "::group::Validating ${skill}"
            if ! python scripts/validate_skill.py "$dir"; then
              failed=1
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "Summary: checked=${checked} skipped=${skipped} failed=${failed}"

          if [ "$checked" -eq 0 ]; then
            echo "::warning::No complete skill packages found; nothing was validated."
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more skills failed validation"
            exit 1
          fi

          echo "All non-placeholder skills passed validation."